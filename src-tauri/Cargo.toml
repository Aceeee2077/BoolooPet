[package]
name = "booloo"
version = "0.6.25"
description = "Booloo · cross-platform desktop pet"
authors = ["Booloo Contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "booloo_lib"
# Desktop-only: the Tauri template also lists staticlib/cdylib for iOS/Android,
# which makes MSVC emit .lib/.exp byproducts and the `linker_messages` warning.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` backs app.macOSPrivateApi in tauri.conf.json: macOS needs it
# for the transparent pet window (it is a no-op on Windows/Linux). Enabling it
# rules out a Mac App Store release, which this build does not target.
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
# The same backend used by the plugin, for transferring an existing startup entry.
auto-launch = "0.5"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# The update probe talks to GitHub and the optional mirror itself: one bare GET
# per endpoint, no REST quota. `rustls-no-provider` keeps this on the ring
# provider the updater plugin already installs instead of pulling in aws-lc-rs.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Decoding the imported appearance + encoding the mask / composited result of the
# cutout editor. `tauri` already pulls `image` in with the png feature for its
# own icon handling, so the extra codecs only widen that build.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# `target/` reached 18.7 GB in debug alone. Two default settings caused nearly all
# of it, and neither is needed to run the app:
#
#   debug = 2              full variable metadata + .pdb (this is the 8.5 GB `deps`)
#   incremental = true     the 6.1 GB `incremental` cache
#
# `line-tables-only` keeps file/line info so panic backtraces stay readable, while
# dropping the variable metadata that dominates the size. Disable it temporarily
# (debug = 2 + incremental = true) only while step-debugging Rust code.
#
# After changing this, run `cargo clean --manifest-path src-tauri/Cargo.toml` once:
# the old artifacts were built with the previous profile and stay on disk otherwise.
[profile.dev]
debug = "line-tables-only"
incremental = false
