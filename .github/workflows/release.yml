name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build, sign & publish (${{ matrix.label }})
    strategy:
      # One platform failing must not cancel the others: a broken macOS build
      # should still leave the Windows installer published.
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            args: '--bundles nsis'
          # Two macOS jobs (one per architecture) is the layout tauri-action
          # documents: each one publishes its own darwin-aarch64 / darwin-x86_64
          # entry into the same latest.json. Replace both with a single
          # `--target universal-apple-darwin` job if you prefer one fat binary.
          - label: macOS Apple Silicon
            os: macos-latest
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - label: macOS Intel
            os: macos-latest
            args: '--target x86_64-apple-darwin --bundles app,dmg'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only the macOS jobs need the extra Apple targets.
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache the Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # A tag whose version disagrees with package.json publishes a release the
      # updater cannot match to the installed build, and a missing changelog entry
      # ships a version with nothing said about it. Both are seconds to check and
      # impossible to undo once the assets are up, so they are checked first.
      # A manual dispatch runs from a branch, where there is no tag to match.
      - name: Release pre-flight
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node scripts/release-check.mjs --no-git --tag "$GITHUB_REF_NAME"
          else
            node scripts/release-check.mjs --no-git
          fi

      # Verify the signing key + password in seconds instead of waiting for a full
      # build. A bad/missing secret is surfaced as an annotation with the reason.
      - name: Verify signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is empty or not set"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty or not set"
            exit 1
          fi
          echo "::notice::private key secret length: ${#TAURI_SIGNING_PRIVATE_KEY} (the key file is 348)"
          echo "::notice::password secret length: ${#TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
          set +e
          echo "preflight" > "$RUNNER_TEMP/preflight.txt"
          out=$(npm exec tauri signer sign "$RUNNER_TEMP/preflight.txt" </dev/null 2>&1)
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "$out"
            echo "$out" | tail -n 5 | while IFS= read -r line; do
              echo "::error::signing key check: $line"
            done
            exit 1
          fi
          echo "Signing key is valid."

      # tauri-action reads version/identifier from src-tauri/tauri.conf.json and
      # builds the frontend via beforeBuildCommand, so no separate npm build here.
      # It signs the installer and publishes latest.json + .sig automatically
      # using the private key from the repository secret.
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing / notarisation is optional. Once an Apple Developer
          # certificate exists, add these repository secrets and uncomment the
          # block below — without them the .dmg is unsigned, so Gatekeeper makes
          # the user right-click → Open the first time, and the macOS updater
          # cannot replace the bundle.
          #
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'Booloo v__VERSION__'
          releaseBody: |
            Booloo 轻量桌宠：内置布噜 / Bulu，可导入自己的图片，在桌面上陪伴与互动。

            - 摸头、摸背、双击与长按互动，眨眼及真实动作动画。
            - 好感度成长、点击热力图、健康计划及待办提醒。
            - 22 枚成就徽章：互动、好感、陪伴与照顾里程碑，记录页可查看进度。
            - 本地自动抠图与手动微调，中英文界面。
            - 保留 Tauri 版的数据与更新标识；正式版迁移旧开机启动项，Windows 安装器迁移旧快捷方式。

            Booloo is a lightweight desktop companion featuring Bulu, image import,
            petting and gesture reactions, friendship growth, wellness reminders,
            a click heatmap, 22 achievement badges, local cutout editing, and
            Chinese / English UI. Existing Tauri settings and the signed update
            channel are preserved.

            Windows: `Booloo_x.y.z_x64-setup.exe`
            macOS: `Booloo_x.y.z_aarch64.dmg` (Apple Silicon) / `Booloo_x.y.z_x64.dmg` (Intel) — unsigned builds need right-click → Open the first time.
            Auto-update is available from v0.5.1 onwards.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
