<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Booloo · 轻量桌宠 / Lightweight Desktop Pet</title>
<meta name="description" content="Booloo 是一只常驻窗口最上层的透明小猫：会走动、会感知电脑状态，能把一张照片变成桌宠。全部在本机完成，不注册、不上传、无遥测。" />
<meta property="og:title" content="Booloo · Lightweight Desktop Pet" />
<meta property="og:description" content="A tiny transparent cat that lives on top of your windows. Local, no account, no telemetry." />

<style>
  :root {
    --pink: #ff8fb0;
    --pink-deep: #ff6d99;
    --blue: #4c8bf5;
    --ink: #1d2233;
    --ink-soft: #5a6172;
    --line: #e9ecf5;
    --card: #ffffff;
    --bg: #f7f8fc;
    --radius: 18px;
    --shadow: 0 10px 30px rgba(38, 50, 90, .08);
    --shadow-lg: 0 24px 60px rgba(38, 50, 90, .14);
    --maxw: 1120px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 22px; }

  /* ---------- top bar ---------- */
  header.bar {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: saturate(180%) blur(12px);
    background: rgba(247, 248, 252, .82);
    border-bottom: 1px solid rgba(233, 236, 245, .9);
  }
  .bar-inner { display: flex; align-items: center; gap: 14px; height: 62px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .2px; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; }
  .bar nav { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .bar nav a { padding: 8px 12px; border-radius: 10px; color: var(--ink-soft); font-size: 14.5px; font-weight: 600; }
  .bar nav a:hover { background: #fff; color: var(--ink); }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: #fff; }
  .lang button {
    border: 0; background: transparent; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700;
    padding: 6px 12px; color: var(--ink-soft);
  }
  .lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  /* ---------- hero ---------- */
  .hero { position: relative; overflow: hidden; padding: 74px 0 60px; }
  .hero::before, .hero::after {
    content: ""; position: absolute; border-radius: 50%; filter: blur(70px); opacity: .5; z-index: 0;
  }
  .hero::before { width: 420px; height: 420px; background: #ffd3e0; top: -140px; left: -100px; }
  .hero::after { width: 460px; height: 460px; background: #d6e5ff; top: -60px; right: -140px; }
  .hero .wrap { position: relative; z-index: 1; text-align: center; }
  .hero-icon { width: 96px; height: 96px; border-radius: 24px; box-shadow: var(--shadow-lg); background: #fff; }
  .hero h1 { font-size: clamp(38px, 6vw, 60px); margin: 22px 0 6px; letter-spacing: -1px; line-height: 1.05; }
  .hero .sub { font-size: clamp(16px, 2.4vw, 21px); color: var(--ink-soft); font-weight: 700; margin: 0 0 18px; }
  .hero .tagline { max-width: 680px; margin: 0 auto 26px; color: var(--ink-soft); font-size: 17px; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 26px; }
  .badges img { height: 20px; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 9px; padding: 14px 26px; border-radius: 14px;
    font-weight: 800; font-size: 16px; border: 1px solid transparent; cursor: pointer; transition: .18s transform, .18s box-shadow, .18s background;
  }
  .btn-primary { background: linear-gradient(135deg, var(--pink-deep), var(--pink)); color: #fff; box-shadow: 0 12px 26px rgba(255, 109, 153, .34); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 18px 34px rgba(255, 109, 153, .42); }
  .btn-ghost { background: #fff; border-color: var(--line); color: var(--ink); box-shadow: var(--shadow); }
  .btn-ghost:hover { transform: translateY(-2px); }
  .meta { margin-top: 16px; font-size: 13.5px; color: #8a91a3; }

  /* ---------- sections ---------- */
  section { padding: 58px 0; }
  .sec-head { text-align: center; margin-bottom: 36px; }
  .sec-head h2 { font-size: clamp(26px, 3.6vw, 34px); margin: 0 0 8px; letter-spacing: -.5px; }
  .sec-head p { margin: 0; color: var(--ink-soft); }

  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px 24px; box-shadow: var(--shadow); }
  .card .num { font-size: 13px; font-weight: 800; color: var(--pink-deep); letter-spacing: 1px; }
  .card h3 { margin: 10px 0 10px; font-size: 19px; line-height: 1.4; }
  .card p { margin: 0; color: var(--ink-soft); font-size: 15px; }

  /* ---------- carousel ---------- */
  .stage {
    position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-lg); overflow: hidden;
  }
  .track { display: flex; transition: transform .5s cubic-bezier(.4, 0, .2, 1); }
  .slide { min-width: 100%; position: relative; background: #eef1f8; }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #e7ebf5; }
  .frame img { width: 100%; height: 100%; display: block; }
  .frame.contain img { object-fit: contain; }
  .frame.cover img { object-fit: cover; object-position: top center; }
  .caption {
    display: flex; align-items: center; gap: 10px; padding: 14px 18px; font-size: 14px; color: var(--ink-soft);
    background: #fff; border-top: 1px solid var(--line);
  }
  .caption b { color: var(--ink); }
  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
    background: rgba(255, 255, 255, .92); cursor: pointer; font-size: 20px; line-height: 1; color: var(--ink);
    box-shadow: var(--shadow); display: grid; place-items: center;
  }
  .nav-btn:hover { background: #fff; }
  .nav-btn.prev { left: 14px; }
  .nav-btn.next { right: 14px; }
  .dots { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
  .dots button { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 0; background: #cfd5e6; cursor: pointer; transition: .2s; }
  .dots button[aria-current="true"] { background: var(--pink-deep); width: 26px; border-radius: 999px; }

  /* ---------- compare table ---------- */
  .cmp { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .cmp th, .cmp td { padding: 14px 18px; text-align: left; font-size: 15px; border-bottom: 1px solid var(--line); }
  .cmp thead th { background: #fbfbfe; font-size: 13.5px; color: var(--ink-soft); letter-spacing: .3px; }
  .cmp tbody tr:last-child td { border-bottom: 0; }
  .cmp td:first-child { color: var(--ink-soft); width: 46%; }
  .cmp td.self { font-weight: 700; color: var(--ink); }
  .cmp td.self .yes { color: #16a34a; }
  .cmp td.other { color: #9aa1b2; }
  .cmp col.self-col { background: #fff8fb; }

  /* ---------- chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 600; color: var(--ink-soft); box-shadow: var(--shadow); }

  /* ---------- download ---------- */
  .dl-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .dl {
    display: flex; align-items: center; gap: 16px; background: #fff; border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); transition: .18s transform, .18s box-shadow;
  }
  .dl:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .dl .ico { font-size: 26px; width: 46px; height: 46px; display: grid; place-items: center; background: #f4f6fd; border-radius: 12px; flex: none; }
  .dl h3 { margin: 0 0 3px; font-size: 16.5px; }
  .dl p { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
  .dl .arrow { margin-left: auto; color: var(--pink-deep); font-weight: 800; }

  /* ---------- privacy ---------- */
  .privacy {
    background: linear-gradient(135deg, #fff, #fff6f9); border: 1px solid #ffe1ea; border-radius: var(--radius);
    padding: 30px 32px; text-align: center; box-shadow: var(--shadow);
  }
  .privacy h2 { margin: 0 0 12px; font-size: 24px; }
  .privacy p { margin: 0 auto; max-width: 720px; color: var(--ink-soft); }

  /* ---------- footer ---------- */
  footer { border-top: 1px solid var(--line); background: #fff; padding: 34px 0; margin-top: 20px; }
  .foot { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; color: var(--ink-soft); font-size: 14px; }
  .foot a { color: var(--pink-deep); font-weight: 700; }

  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.in { opacity: 1; transform: none; }

  @media (max-width: 900px) {
    .cards { grid-template-columns: 1fr; }
    .dl-grid { grid-template-columns: 1fr; }
    .cmp td:first-child { width: auto; }
    .bar nav a.opt { display: none; }
  }
  @media (max-width: 560px) {
    .cmp th, .cmp td { padding: 11px 12px; font-size: 13.5px; }
    .nav-btn { width: 38px; height: 38px; }
  }
</style>
</head>

  // Short feature chips, kept out of the object above so both languages stay readable.
  var CHIPS = {
    zh: ['内置布噜与姿势动画', '换成自己的照片', '导入宠物包', '分区互动（摸头 / 摸背 / 戳 / 双击）', '拖着甩出去、撞墙反弹', '投喂与逗猫棒', '待办提醒', '健康计划：站立 / 护眼 / 喝水', '点击热力图', '好感度五档', '本周小结与年度回顾', '设置分五个分区', '数据备份与恢复', '诊断日志导出', '中英双语，可跟随系统', '自动更新', '不占任务栏'],
    en: ['Bulu and its pose atlas', 'Use your own photo', 'Import a pet pack', 'Part-aware touch', 'Throw it, it bounces', 'Treats and the cat teaser', 'Reminders on a sign', 'Health plan: stand, look away, water', 'Click heatmap', 'Five affinity levels', 'Weekly summary and year in review', 'Five-tab settings', 'Back up and restore data', 'Export diagnostics', 'Chinese / English, or follow the system', 'Auto-update', 'No taskbar button']
  };

  var chipsBox = document.getElementById('chips');

  function applyLang(lang) {
    var dict = I18N[lang] || I18N.zh;
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var key = el.getAttribute('data-i18n');
      if (dict[key] !== undefined) el.textContent = dict[key];
    });
    document.querySelectorAll('[data-i18n-aria]').forEach(function (el) {
      var key = el.getAttribute('data-i18n-aria');
      if (dict[key] !== undefined) el.setAttribute('aria-label', dict[key]);
    });
    // Screenshots ship once per language.
    document.querySelectorAll('img[data-src-zh]').forEach(function (img) {
      var next = lang === 'en' ? img.getAttribute('data-src-en') : img.getAttribute('data-src-zh');
      if (next && img.getAttribute('src') !== next) img.setAttribute('src', next);
    });
    document.querySelectorAll('[data-shot]').forEach(function (a) {
      var shot = a.getAttribute('data-shot');
      var suffix = lang === 'en' ? '-en' : '';
      a.setAttribute('href', 'screenshots/lightweight-' + shot + suffix + '.png');
    });
    if (chipsBox) {
      chipsBox.innerHTML = '';
      (CHIPS[lang] || CHIPS.zh).forEach(function (label) {
        var s = document.createElement('span');
        s.className = 'chip';
        s.textContent = label;
        chipsBox.appendChild(s);
      });
    }
    document.querySelectorAll('.lang button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang));
    });
    try { localStorage.setItem('booloo-lang', lang); } catch (e) {}
  }

  var stored = null;
  try { stored = localStorage.getItem('booloo-lang'); } catch (e) {}
  var initial = stored || ((navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en');
  applyLang(initial);

  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () { applyLang(b.getAttribute('data-lang')); });
  });

  // ---------- carousel ----------
  var track = document.getElementById('track');
  var dots = document.getElementById('dots');
  var slides = track ? track.children.length : 0;
  var index = 0, timer = null;

  function go(i) {
    if (!slides) return;
    index = (i + slides) % slides;
    track.style.transform = 'translateX(' + (-index * 100) + '%)';
    Array.prototype.forEach.call(dots.children, function (d, n) {
      d.setAttribute('aria-current', String(n === index));
    });
  }
  function play() { timer = setInterval(function () { go(index + 1); }, 5200); }
  function pause() { if (timer) { clearInterval(timer); timer = null; } }

  if (slides) {
    for (var i = 0; i < slides; i++) {
      (function (n) {
        var d = document.createElement('button');
        d.type = 'button';
        d.setAttribute('aria-label', String(n + 1));
        d.addEventListener('click', function () { go(n); pause(); play(); });
        dots.appendChild(d);
      })(i);
    }
    go(0);
    play();
    var stage = document.getElementById('stage');
    stage.addEventListener('mouseenter', pause);
    stage.addEventListener('mouseleave', play);
    stage.querySelector('.nav-btn.prev').addEventListener('click', function () { go(index - 1); pause(); play(); });
    stage.querySelector('.nav-btn.next').addEventListener('click', function () { go(index + 1); pause(); play(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') go(index - 1);
      if (e.key === 'ArrowRight') go(index + 1);
    });
  }

  // ---------- latest release (direct .exe / .dmg links) ----------
  function humanSize(bytes) {
    if (!bytes) return '';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }
  fetch('https://api.github.com/repos/' + REPO + '/releases/latest', {
    headers: { Accept: 'application/vnd.github+json' }
  }).then(function (r) {
    return r.ok ? r.json() : null;
  }).then(function (rel) {
    if (!rel) return;
    var assets = rel.assets || [];
    var exe = assets.filter(function (a) { return /-setup\.exe$/i.test(a.name); })[0]
           || assets.filter(function (a) { return /\.exe$/i.test(a.name); })[0];
    var dmg = assets.filter(function (a) { return /aarch64\.dmg$/i.test(a.name); })[0]
           || assets.filter(function (a) { return /\.dmg$/i.test(a.name); })[0];
    if (exe) {
      document.getElementById('dl-windows').href = exe.browser_download_url;
      document.getElementById('dl-win-card').href = exe.browser_download_url;
    }
    if (dmg) {
      document.getElementById('dl-mac-card').href = dmg.browser_download_url;
    }
    var meta = document.getElementById('release-meta');
    var tag = rel.tag_name ? rel.tag_name.replace(/^v/, '') : '';
    var size = humanSize(exe && exe.size);
    var lang = document.documentElement.lang === 'en' ? 'en' : 'zh';
    var parts = [];
    if (tag) parts.push((lang === 'en' ? 'Latest v' : '最新版 v') + tag);
    if (size) parts.push(size);
    parts.push(lang === 'en' ? 'no account · no telemetry' : '不注册 · 无遥测');
    if (meta) meta.textContent = parts.join(' · ');
  }).catch(function () {});

  // ---------- reveal on scroll ----------
  var obs = 'IntersectionObserver' in window ? new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) { en.target.classList.add('in'); obs.unobserve(en.target); }
    });
  }, { threshold: .12 }) : null;
  document.querySelectorAll('.reveal').forEach(function (el) {
    if (obs) obs.observe(el); else el.classList.add('in');
  });
})();
